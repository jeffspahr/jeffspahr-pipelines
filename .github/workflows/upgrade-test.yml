name: Envoy 1.40 focused compatibility validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python -m pip install 'grpcio==1.76.0' 'PyYAML==6.0.3'
      - name: Record candidate identity
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/harness-commit.txt
          git diff bbdbc4143b5556f71c670696148884393aea59ca -- third_party/metadata_envoy manifests/kustomize/base/metadata manifests/kustomize/env/cert-manager > evidence/runtime-diff.txt
          test ! -s evidence/runtime-diff.txt
      - name: Validate candidate metadata proxy
        run: python .github/resources/scripts/envoy140_validation.py
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: envoy140-acceptance
          path: evidence
          retention-days: 14
          if-no-files-found: error
