# Diagnostic wrapper only; do not merge this image-reuse configuration into release.
name: KFP upgrade tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adoption-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness-adoption:
    # Explicitly activate only after reviewing the candidate scheduling policy.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      CLUSTER_NAME: kfp-readiness
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify reused image provenance and runtime equivalence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: '37846429718'
          SOURCE_SHA: '858f0cd46d04cd277e74734fdbccb80c902257a2'
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" > "$RUNNER_TEMP/adoption-image-source.json"
          python3 - <<'PYPROVENANCE'
          import json
          import os
          from pathlib import Path
          import subprocess
          source = os.environ['SOURCE_SHA']
          run = json.loads((Path(os.environ['RUNNER_TEMP']) / 'adoption-image-source.json').read_text())
          assert run['id'] == int(os.environ['SOURCE_RUN'])
          assert run['head_sha'] == source
          assert run['repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert run['path'] == '.github/workflows/upgrade-test.yml'
          assert run['event'] == 'workflow_dispatch'
          subprocess.run(['git', 'merge-base', '--is-ancestor', source, 'HEAD'], check=True)
          changed = subprocess.check_output(['git', 'diff', '--name-only', '-z', source, 'HEAD']).decode().split('\0')
          allowed = {
              '.github/workflows/upgrade-test.yml',
              '.github/actions/deploy/action.yml',
              '.github/resources/scripts/readiness-adoption.sh',
              '.github/resources/scripts/readiness-schedules.sh',
          }
          unexpected = [p for p in changed if p and p not in allowed and not p.startswith(('tools/upgrade-readiness/', 'docs/'))]
          assert not unexpected, 'Production changes prohibit image reuse: ' + repr(unexpected)
          # The deploy wrapper may change only the artifact source, never deployment behavior.
          original = subprocess.check_output(['git', 'show', source + ':.github/actions/deploy/action.yml']).decode()
          expected = original.replace('run: ./.github/resources/scripts/wait-for-image-artifacts.sh', 'run: GITHUB_RUN_ID=37846429718 ./.github/resources/scripts/wait-for-image-artifacts.sh')
          expected = expected.replace('        pattern: "!*.dockerbuild"', '        pattern: "!*.dockerbuild"\n        run-id: \'37846429718\'\n        github-token: ' + '$' + '{{ github.token }}')
          assert Path('.github/actions/deploy/action.yml').read_text() == expected
          report = dict(scope='adoption_diagnostic_image_provenance', outcome='passed',
                        image_source_run=run['id'], image_source_sha=source,
                        validation_sha=subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(),
                        production_tree_unchanged=True, changed_files=[p for p in changed if p])
          directory = Path(os.environ['RUNNER_TEMP']) / 'readiness-schedules/reports'
          directory.mkdir(parents=True, exist_ok=True)
          (directory / 'adoption-image-provenance.json').write_text(json.dumps(report, sort_keys=True) + '\n')
          PYPROVENANCE

      - name: Set up Python
        uses: ./.github/actions/setup-python-pip-cache
        with:
          python-version: '3.11'
          cache-scope: readiness-adoption
          cache-dependency-hash: ${{ hashFiles('tools/upgrade-readiness/requirements.txt') }}

      - name: Install fixture manifest reader
        run: python3 -m pip install -r tools/upgrade-readiness/requirements.txt

      - name: Require integrated scheduling policy
        run: bash .github/resources/scripts/readiness-schedules.sh preflight

      - name: Create isolated readiness cluster
        uses: ./.github/actions/create-cluster
        with:
          k8s_version: 'v1.36.1'
          cluster_name: kfp-readiness

      - name: Populate 2.17.2 and capture target predictions
        run: bash .github/resources/scripts/readiness-schedules.sh source

      - name: Prepare populated offline adoption cutover
        run: bash .github/resources/scripts/readiness-adoption.sh source

      - name: Deploy verified source-run images with writers stopped
        uses: ./.github/actions/deploy
        with:
          cluster_name: kfp-readiness
          image_path: images_${{ github.run_id }}
          image_tag: latest
          image_registry: kind-registry:5000
          forward_port: 'false'

      - name: Adopt legacy schedules and verify live continuation
        run: bash .github/resources/scripts/readiness-adoption.sh target

      - name: Upload isolated-fixture readiness evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: readiness-adoption-${{ github.run_id }}
          path: ${{ runner.temp }}/readiness-schedules/reports/*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove isolated readiness cluster
        if: ${{ always() }}
        run: kind delete cluster --name kfp-readiness
