name: Istio image compatibility on KFP 2.18.2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, distroless]
    env:
      VARIANT: ${{ matrix.variant }}
      COMMUNITY_SHA: 2b97be072f7d8889a2404c00fcaac2027bdac17c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Start isolated Kubernetes cluster
        run: kind create cluster --name probe --image kindest/node:v1.36.1 --wait 120s
      - name: Install pinned Istio CRDs, namespace and mesh
        run: |
          set -euo pipefail
          kubectl create ns kubeflow
          kubectl apply -k "https://github.com/kubeflow/community-distribution/common/istio/istio-crds/base?ref=$COMMUNITY_SHA"
          kubectl apply -k "https://github.com/kubeflow/community-distribution/common/istio/istio-namespace/base?ref=$COMMUNITY_SHA"
          overlay=manifests/kustomize/third-party/istio/install
          if [[ "$VARIANT" == distroless ]]; then
            sed -i 's/newTag: 1.31.4$/newTag: 1.31.4-distroless/' "$overlay/kustomization.yaml"
            sed -i 's/"variant": ""/"variant": "distroless"/' "$overlay/injector-values.json"
          fi
          kubectl apply -k "$overlay"
          kubectl -n kube-system rollout status daemonset/istio-cni-node --timeout=240s
          kubectl -n istio-system rollout status deployment/istiod --timeout=240s
          kubectl -n istio-system rollout status deployment/istio-ingressgateway --timeout=240s
      - name: Verify injected sidecar, gateway routing and mTLS principal policy
        run: |
          set -euo pipefail
          kubectl label ns kubeflow istio-injection=enabled --overwrite
          kubectl apply -f .github/resources/mesh-probe.yaml
          kubectl -n kubeflow wait --for=condition=Ready pod/mesh-echo --timeout=180s
          actual=$(kubectl -n kubeflow get pod mesh-echo -o jsonpath='{.spec.containers[?(@.name=="istio-proxy")].image}{.spec.initContainers[?(@.name=="istio-proxy")].image}')
          expected=docker.io/istio/proxyv2:1.31.4
          if [[ "$VARIANT" == distroless ]]; then expected+=-distroless; fi
          echo "Injected $actual, expected $expected"
          test "$actual" = "$expected"
          kubectl -n istio-system port-forward service/istio-ingressgateway 18080:80 >/tmp/forward.log 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid" || true' EXIT
          wait_for_http() {
            for try in {1..60}; do
              actual_status=$(curl -s -m 3 -o /tmp/probe-body -w '%{http_code}' -H 'Host: kfp-probe.test' http://127.0.0.1:18080/ || true)
              if [[ "$actual_status" == "$1" ]]; then echo "Observed HTTP $1"; return 0; fi
              sleep 2
            done
            cat /tmp/forward.log; cat /tmp/probe-body || true
            return 1
          }
          wait_for_http 200
          grep -Fx 'kfp-2182-mesh-ok' /tmp/probe-body
          kubectl -n kubeflow delete authorizationpolicy allow-probe-gateway
          wait_for_http 403
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl get events -A --sort-by=.metadata.creationTimestamp | tail -80
          kubectl -n istio-system logs -l app=istiod --tail=20 || true
          kubectl -n kube-system logs -l k8s-app=istio-cni-node --tail=20 || true
