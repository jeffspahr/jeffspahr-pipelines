name: MySQL run-list reproduction
on:
  push:
    branches: [codex/mysql-run-list-repro]
permissions:
  contents: read
jobs:
  mysql-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: kfp_test
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pkfp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - name: Reproduce generated run list query
        env:
          KFP_RECURRING_MYSQL_TEST_DSN: root:kfp_test@tcp(127.0.0.1:${{ job.services.mysql.ports['3306'] }})/?parseTime=true
        run: go test ./backend/src/apiserver/storage -run '^TestMySQLRunListLargeManifests$' -count=1 -v
