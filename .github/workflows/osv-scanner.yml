name: Auxiliary tooling security audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install scanner
        run: |
          if [ "$(uname -m)" = aarch64 ]; then
            arch=ARM64
            checksum=a1ee9f6ffb7d112b64ff726a2a0717c21175c1114361391f4a132956751a13b3
          else
            arch=64bit
            checksum=c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
          fi
          curl -fsSL --retry 3 "https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-${arch}.tar.gz" -o /tmp/trivy.tar.gz
          echo "${checksum}  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
      - name: Build generator
        run: docker build --pull --no-cache -f backend/api/Dockerfile -t kfp-api-generator:ci .
      - name: Scan generator
        run: |
          /tmp/trivy image --scanners vuln --format json --output trivy-api-generator.json kfp-api-generator:ci
          docker image inspect kfp-api-generator:ci > inspect-api-generator.json
      - name: Build release tools
        run: docker build --no-cache --build-arg BASE_IMAGE=kfp-api-generator:ci --build-arg NODE_VERSION="$(tr -d 'v\n' < frontend/.nvmrc)" -f release/Dockerfile.release -t kfp-release:ci .
      - name: Scan release tools
        run: |
          /tmp/trivy image --scanners vuln --format json --output trivy-release-tools.json kfp-release:ci
          docker image inspect kfp-release:ci > inspect-release-tools.json
      - name: Native non-root generation and release smoke
        run: bash .github/resources/scripts/maintainer_tools_smoke.sh '${{ matrix.arch }}' "$PWD/smoke"
      - name: Release YAML regression tests
        run: docker run --rm -v "$PWD:/src" -w /src kfp-release:ci python3 manifests/kustomize/hack/yq_release_test.py
      - name: Report fixable findings
        run: |
          python3 - <<'PY'
          import glob,json
          failures=[]
          for path in glob.glob('trivy-*.json'):
              data=json.load(open(path))
              vulns=[v for r in data.get('Results',[]) for v in r.get('Vulnerabilities',[]) if v.get('FixedVersion')]
              print(path,len(vulns))
              failures.extend(vulns)
          assert not failures, f'{len(failures)} fixable findings remain'
          PY
      - name: Retain evidence
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: tools-${{ matrix.arch }}
          path: |
            trivy-*.json
            inspect-*.json
            smoke
