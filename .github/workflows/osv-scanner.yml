name: Release artifact CVE audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  images:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {name: frontend, dockerfile: frontend/Dockerfile, context: ., arch: amd64, runner: ubuntu-24.04}
          - {name: frontend, dockerfile: frontend/Dockerfile, context: ., arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install scanner
        run: |
          if [ "$(uname -m)" = aarch64 ]; then
            arch=ARM64
            checksum=a1ee9f6ffb7d112b64ff726a2a0717c21175c1114361391f4a132956751a13b3
          else
            arch=64bit
            checksum=c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
          fi
          curl -fsSL --retry 3 "https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-${arch}.tar.gz" -o /tmp/trivy.tar.gz
          echo "${checksum}  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
      - name: Build release artifact
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          CONTEXT: ${{ matrix.context }}
        run: |
          docker build --pull --build-arg NODE_VERSION="$(tr -d 'v\n' < frontend/.nvmrc)" --build-arg COMMIT_SHA="$GITHUB_SHA" --build-arg COMMIT_HASH="$GITHUB_SHA" --build-arg TAG_NAME=2.18-cve-audit -f "$DOCKERFILE" -t kfp-audit:local "$CONTEXT"
          docker image inspect kfp-audit:local > image-inspect.json
      - name: Scan all severities with available fixes
        run: |
          /tmp/trivy image --scanners vuln --ignore-unfixed --format json --output trivy.json --exit-code 1 kfp-audit:local
      - name: Retain evidence
        if: always()
        uses: ./.github/actions/upload-artifact-with-retry
        with:
          name: cve-${{ matrix.name }}-${{ matrix.arch }}
          path: |
            trivy.json
            image-inspect.json
