# Fork-only benchmark harness; not part of the upstream PR.
name: Shared CI Images
on:
  push:
    branches: [codex/shared-image-benchmark]
permissions:
  contents: read
  actions: read

# A newer PR revision must not cancel images still needed by an older consumer.
concurrency:
  group: shared-ci-images-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      amd64: ${{ steps.plan.outputs.amd64 }}
      arm64: ${{ steps.plan.outputs.arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Wait for common runtime preparation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/benchmarks/wait-runtime.py
      - name: Record checked-out source identity
        run: python3 .github/resources/scripts/shared_ci_images.py source --output source.json
      - name: Publish source identity before image builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-image-source-attempt-${{ github.run_attempt }}
          path: source.json
          if-no-files-found: error
          retention-days: 1
      - name: Select required architectures
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/resources/scripts/shared_ci_image_plan.js

  amd64:
    needs: source
    if: needs.source.outputs.amd64 == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/image-builds.yml
    with:
      architecture: amd64
      shared: true

  arm64:
    needs: source
    if: needs.source.outputs.arm64 == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/image-builds.yml
    with:
      architecture: arm64
      shared: true
