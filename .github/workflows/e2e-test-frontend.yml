name: 2.18 exact-source namespace switching
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          repository: kubeflow/pipelines
          ref: e2ccfb1022fcdc748d7f4126d33e99b1c8e58e67
      - uses: actions/checkout@v7
        with:
          path: fixture
      - uses: ./.github/actions/create-cluster
        with:
          k8s_version: v1.36.1
      - uses: ./fixture/.github/namespace-live/deploy
        with:
          forward_port: 'false'
          image_path: images_${{ github.run_id }}
          image_tag: latest
          image_registry: kind-registry:5000
      - name: Configure isolated namespace fixture
        run: bash fixture/.github/namespace-live/setup.sh
      - name: Build browser runner
        run: docker build --build-arg "NODE_VERSION=$(tr -d 'v' < frontend/.nvmrc)" -t namespace-browser test/frontend-integration-test
      - name: Exercise real UI and private pipeline APIs
        run: |
          docker run --net=host --rm \
            -e KFP_BASE_URL=http://localhost:3001 \
            -e WDIO_SPECS=./namespace-switch.spec.js \
            -e FRONTEND_INTEGRATION_SCREENSHOT_DIR=/tmp/evidence \
            -e WDIO_JUNIT_OUTPUT_DIR=/tmp/evidence \
            -v "$PWD/fixture/.github/namespace-live/namespace-switch.spec.js:/src/namespace-switch.spec.js:ro" \
            -v /tmp/namespace-evidence:/tmp/evidence namespace-browser
      - name: Collect source and image identities
        if: always()
        run: |
          mkdir -p /tmp/namespace-evidence
          git rev-parse HEAD > /tmp/namespace-evidence/application-sha.txt
          git -C fixture rev-parse HEAD > /tmp/namespace-evidence/fixture-sha.txt
          kubectl -n kubeflow get pods -o json > /tmp/namespace-evidence/pods.json
          kubectl -n kubeflow logs deployment/ml-pipeline --tail=100 > /tmp/namespace-evidence/api.log || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: namespace-switch-evidence
          path: /tmp/namespace-evidence
