name: Third-party TensorBoard compatibility probes
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: galaxy
          image: quay.io/galaxy/tensorboard@sha256:7c59ac15a1d060fbb67ea2ff9dfe465b9025f7d0183e00f6fb11ff19a9f30baf
        - name: jasongzy
          image: docker.io/jasongzy/tensorboard-docker@sha256:44479b3593a912dc0c827ec926359d7a2f0f17c4049c46bf2b0067b3e01944f1
        - name: hpecmf
          image: docker.io/hpecmf/tensorboard@sha256:41dedef787216a50def1befa29adf33344ccf9ea8a0ca4eef348dc27b58f518b
        - name: federcmf
          image: docker.io/federcmf/tensorboard@sha256:dc152d38a2dfbdc0866fdb91d45476df4407ac1dc4dca108d0977ec5e6d0fce5
    steps:
    - uses: actions/checkout@v7
    - name: Pull exact candidate and start storage emulators
      env:
        IMAGE: ${{ matrix.image }}
      run: |
        set -euo pipefail
        mkdir evidence
        printf '%s\n' "$IMAGE" > evidence/reference.txt
        docker pull "$IMAGE"
        docker image inspect "$IMAGE" > evidence/image.json
        docker run -d --name s3 --network host motoserver/moto:5.1.15@sha256:8860b18917e1ee4d067df19a406ae95dc26037e6965d5b499e1cffd33755b914
        docker run -d --name gcs --network host fsouza/fake-gcs-server:1.54.0@sha256:3730da0e31f7e5186a90ec4899dc2c336104e7599df400411392ef17e684c31f -scheme http -port 4443 -external-url http://127.0.0.1:4443
        curl --aws-sigv4 aws:amz:us-east-1:s3 --user fixture:fixture --retry 30 --retry-connrefused --retry-delay 2 -fsS -X PUT http://127.0.0.1:5000/tb-probe
        curl --aws-sigv4 aws:amz:us-east-1:s3 --user fixture:fixture -fsS -X PUT --data-binary 'kfp-storage-probe' http://127.0.0.1:5000/tb-probe/logs/probe.txt
        curl --retry 30 --retry-connrefused --retry-delay 2 -fsS -X POST -H 'Content-Type: application/json' -d '{"name":"tb-probe"}' http://127.0.0.1:4443/storage/v1/b
        curl -fsS -X POST -H 'Content-Type: text/plain' --data-binary 'kfp-storage-probe' 'http://127.0.0.1:4443/upload/storage/v1/b/tb-probe/o?uploadType=media&name=logs%2Fprobe.txt'
        test "$(curl --aws-sigv4 aws:amz:us-east-1:s3 --user fixture:fixture -fsS http://127.0.0.1:5000/tb-probe/logs/probe.txt)" = kfp-storage-probe
        test "$(curl -fsS 'http://127.0.0.1:4443/download/storage/v1/b/tb-probe/o/logs%2Fprobe.txt?alt=media')" = kfp-storage-probe
    - name: Probe unchanged image as non-root
      env:
        IMAGE: ${{ matrix.image }}
      run: |
        set -euo pipefail
        docker run --rm --network host --user 1000:1000 --entrypoint python \
          -e HOME=/tmp -e AWS_ACCESS_KEY_ID=fixture -e AWS_SECRET_ACCESS_KEY=fixture \
          -e AWS_DEFAULT_REGION=us-east-1 -e AWS_EC2_METADATA_DISABLED=true \
          -e S3_ENDPOINT=http://127.0.0.1:5000 -e STORAGE_EMULATOR_HOST=http://127.0.0.1:4443 \
          -v "$PWD/.github/resources/tb-thirdparty-probe.py:/probe.py:ro" \
          "$IMAGE" /probe.py > evidence/probe.json
        cat evidence/probe.json
    - name: Preserve storage diagnostics
      if: always()
      run: |
        docker logs s3 > evidence/s3.log 2>&1 || true
        docker logs gcs > evidence/gcs.log 2>&1 || true
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: thirdparty-tensorboard-${{ matrix.name }}
        path: evidence
        retention-days: 14
