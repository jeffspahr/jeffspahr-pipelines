name: 2.18 PostgreSQL and TensorBoard qualification
on:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  tensorboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - name: Start actual viewer image
      run: "docker run -d --name tensorboard -p127.0.0.1:6006:6006 -v \"$PWD/.github/resources/patch-acceptance/tensorboard.py:/acceptance.py:ro\"\
        \ tensorflow/tensorflow:2.20.0@sha256:6b0a7db409e62b7cf188ce72074c520af3e8c21f6d4d5b206f700520594dfb5a\
        \ python /acceptance.py\nfor i in $(seq 1 120); do\n  if docker exec tensorboard\
        \ test -f /tmp/tensorboard-ready; then break; fi\n  if [[ $(docker inspect\
        \ -f '{{.State.Running}}' tensorboard) != true ]]; then docker logs tensorboard;\
        \ exit 1; fi\n  sleep 2\ndone\ndocker exec tensorboard cat /tmp/tensorboard-ready\
        \ | tee schemes.json\n"
    - name: Exercise browser navigation under proxy prefix
      run: 'mkdir /tmp/browser

        cd /tmp/browser

        npm install playwright@1.56.1

        npx playwright install --with-deps chromium

        NODE_PATH=/tmp/browser/node_modules node "$GITHUB_WORKSPACE/.github/resources/patch-acceptance/tensorboard.cjs"

        '
    - name: Require existing storage reader schemes
      run: 'python3 - <<''PY''

        import json

        schemes=json.load(open(''schemes.json''))

        assert ''gs'' in schemes, schemes

        assert ''s3'' in schemes, schemes

        PY

        '
    - name: Preserve runtime diagnostics
      if: always()
      run: docker logs tensorboard > tensorboard-runtime.log 2>&1
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: tensorboard-runtime
        path: 'tensorboard-runtime.log

          schemes.json

          '
        retention-days: 7
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: jeffspahr/jeffspahr-pipelines
        ref: bace9e83da95bb6dde6fb60f3aec4c29a3d544dc
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - run: npm ci
      working-directory: frontend
    - run: npx vitest run src/components/viewers/Tensorboard.test.tsx
      working-directory: frontend
    - run: npm run typecheck
      working-directory: frontend
    - run: npx prettier --check src/components/viewers/Tensorboard.tsx src/components/viewers/Tensorboard.test.tsx
      working-directory: frontend
    - run: npm run build:viewer
      working-directory: frontend
    - run: git diff --binary > viewer-assets.patch
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: tensorboard-viewer-assets
        path: viewer-assets.patch
        retention-days: 7
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
        - key: tensorboard
          image: tensorflow/tensorflow:2.20.0@sha256:6b0a7db409e62b7cf188ce72074c520af3e8c21f6d4d5b206f700520594dfb5a
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: kubeflow/pipelines
        ref: 2143a241f968408bb49068c1a3d9e377572ebf3f
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - run: pip install -r .github/scripts/requirements.txt
    - uses: ./.github/actions/setup-osv-scanner
      with:
        arch: amd64
    - env:
        IMAGE: ${{ matrix.image }}
        PYTHONPATH: release
      run: python .github/resources/scripts/third_party_image_scan.py scan --image
        "$IMAGE" --output evidence
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: patch-image-scan-${{ matrix.key }}
        path: evidence
        retention-days: 7
