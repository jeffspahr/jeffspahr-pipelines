name: Supplemental 2.18 deployed image scan
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - key: cloudsql-before
            image: "gcr.io/cloudsql-docker/gce-proxy:1.38.3"
          - key: cloudsql-after
            image: "gcr.io/cloudsql-docker/gce-proxy:1.38.4"
          - key: meta-before
            image: "ghcr.io/metacontroller/metacontroller:v4.16.2"
          - key: meta-after
            image: "ghcr.io/metacontroller/metacontroller:v4.16.7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install -r .github/scripts/requirements.txt
      - uses: ./.github/actions/setup-osv-scanner
        with:
          arch: amd64
      - name: Scan exact deployment image
        env:
          IMAGE: ${{ matrix.image }}
          IMAGE_KEY: ${{ matrix.key }}
          PYTHONPATH: release
        run: |
          python .github/resources/scripts/third_party_image_scan.py scan --image "$IMAGE" --output "evidence/$IMAGE_KEY"
      - name: Preserve CLI interface
        env:
          IMAGE: ${{ matrix.image }}
          IMAGE_KEY: ${{ matrix.key }}
        run: |
          docker image inspect "$IMAGE" > "evidence/$IMAGE_KEY/docker-inspect.json"
          set +e
          docker run --rm "$IMAGE" --help > "evidence/$IMAGE_KEY/help.txt" 2>&1
          status=$?
          echo "$status" > "evidence/$IMAGE_KEY/help-exit.txt"
          test "$status" = 0 || test "$status" = 2
      - name: Preserve evidence and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: supplemental-${{ matrix.key }}
          path: evidence
          if-no-files-found: error
          retention-days: 14
