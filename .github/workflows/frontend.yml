name: 2.18 PostgreSQL and TensorBoard qualification
on:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  tensorboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: jeffspahr/jeffspahr-pipelines
        ref: 3c69c371b49281fa68ff2f64c4c7f3b0bcda5cb0
        path: source
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - name: Start actual viewer image
      run: "set -euo pipefail\ndocker build -f source/backend/Dockerfile.tensorboard\
        \ -t kfp-tensorboard:test source\ndocker run -d --name s3 --network host motoserver/moto:5.1.15@sha256:8860b18917e1ee4d067df19a406ae95dc26037e6965d5b499e1cffd33755b914\n\
        docker run -d --name gcs --network host fsouza/fake-gcs-server:1.54.0@sha256:3730da0e31f7e5186a90ec4899dc2c336104e7599df400411392ef17e684c31f\
        \ -scheme http -port 4443 -external-url http://127.0.0.1:4443\ndocker run\
        \ -d --name tensorboard --network host -e S3_ENDPOINT=http://127.0.0.1:5000\
        \ -e STORAGE_EMULATOR_HOST=http://127.0.0.1:4443 -e AWS_ACCESS_KEY_ID=test\
        \ -e AWS_SECRET_ACCESS_KEY=test -e AWS_DEFAULT_REGION=us-east-1 -v \"$PWD/.github/resources/patch-acceptance/tensorboard.py:/acceptance.py:ro\"\
        \ kfp-tensorboard:test python /acceptance.py\nfor i in $(seq 1 120); do\n\
        \  if docker exec tensorboard test -f /tmp/tensorboard-ready; then break;\
        \ fi\n  if [[ $(docker inspect -f '{{.State.Running}}' tensorboard) != true\
        \ ]]; then docker logs tensorboard; exit 1; fi\n  sleep 2\ndone\ndocker exec\
        \ tensorboard cat /tmp/tensorboard-ready | tee schemes.json\n"
    - name: Exercise browser navigation under proxy prefix
      run: 'mkdir /tmp/browser

        cd /tmp/browser

        npm install playwright@1.56.1

        npx playwright install --with-deps chromium

        NODE_PATH=/tmp/browser/node_modules node "$GITHUB_WORKSPACE/.github/resources/patch-acceptance/tensorboard.cjs"

        '
    - name: Require existing storage reader schemes
      run: 'python3 - <<''PY''

        import json

        schemes=json.load(open(''schemes.json''))

        assert ''gs'' in schemes, schemes

        assert ''s3'' in schemes, schemes

        PY

        '
    - name: Preserve runtime diagnostics
      if: always()
      run: docker logs tensorboard > tensorboard-runtime.log 2>&1
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: tensorboard-runtime
        path: 'tensorboard-runtime.log

          schemes.json

          '
        retention-days: 7
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      if: always()
      with:
        repository: kubeflow/pipelines
        ref: 2143a241f968408bb49068c1a3d9e377572ebf3f
        path: tooling
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      if: always()
      with:
        python-version: '3.13'
    - run: pip install -r tooling/.github/scripts/requirements.txt
      if: always()
    - uses: ./tooling/.github/actions/setup-osv-scanner
      if: always()
      with:
        arch: amd64
    - name: Scan built runtime by immutable image ID
      if: always()
      env:
        PYTHONPATH: tooling/release
      run: 'set -euo pipefail

        mkdir -p evidence

        docker image inspect kfp-tensorboard:test > evidence/image-inspect.json

        python - <<''SCAN''

        import json

        from pathlib import Path

        from kfpr.osv_image_scan import scan_image

        image=json.load(open(''evidence/image-inspect.json''))[0][''Id'']

        scan_image(image,''linux/amd64'',Path(''evidence''),''json'')

        SCAN

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: native-tensorboard-scan
        path: evidence
        retention-days: 7
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: jeffspahr/jeffspahr-pipelines
        ref: 3c69c371b49281fa68ff2f64c4c7f3b0bcda5cb0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - run: npm ci
      working-directory: frontend
    - run: npm run build:css
      working-directory: frontend
      if: success() || failure()
    - run: npx vitest run src/components/viewers/Tensorboard.test.tsx
      working-directory: frontend
      if: success() || failure()
    - run: npm run typecheck
      working-directory: frontend
      if: success() || failure()
    - run: npx prettier --check src/components/viewers/Tensorboard.tsx src/components/viewers/Tensorboard.test.tsx
      working-directory: frontend
      if: success() || failure()
    - run: npm run build:viewer
      working-directory: frontend
      if: success() || failure()
    - run: git diff --binary > viewer-assets.patch
      if: success() || failure()
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: tensorboard-viewer-assets
        path: viewer-assets.patch
        retention-days: 7
  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: jeffspahr/jeffspahr-pipelines
        ref: 3c69c371b49281fa68ff2f64c4c7f3b0bcda5cb0
    - run: 'docker build -f backend/Dockerfile.tensorboard -t kfp-tensorboard:test
        .

        docker run --rm kfp-tensorboard:test tensorboard --version

        docker run --rm kfp-tensorboard:test python -c "import boto3,gcsfs; from tensorboard.compat
        import tf; print(tf.io.gfile.__name__)"'
defaults:
  run:
    shell: bash
