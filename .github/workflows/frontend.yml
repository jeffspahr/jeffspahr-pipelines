name: Python source dependency acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 4b6658969d5eae372a9ccd83af0a9fe56aed700e
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: ./.github/actions/protobuf
      - name: Install sample and local packages
        run: python -m pip install sdk/python backend/api/v2beta1/python_http_client -r samples/core/artifact_previews/requirements.txt pytest==9.0.3 absl-py pytest-subtests nbformat
      - name: Validate installed dependencies
        run: python -m pip check
      - name: Exercise sample producers and previews
        env:
          HF_HUB_OFFLINE: '1'
        run: python -m pytest -v samples/core/artifact_previews/artifact_previews_unit_test.py
