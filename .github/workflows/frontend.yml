name: 2.18 PostgreSQL and TensorBoard qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    strategy:
      fail-fast: false
      matrix:
        major: ['18', '14']
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        if: matrix.major == '18'
        with:
          go-version-file: go.mod
          cache: true
      - name: Persisted database and application schema upgrade
        env:
          MAJOR: ${{ matrix.major }}
        run: |
          if [[ "$MAJOR" == 18 ]]; then go build -o /tmp/kfp-schema .github/resources/patch-acceptance/kfp-schema.go; fi
          KFP_SCHEMA=/tmp/kfp-schema bash .github/resources/patch-acceptance/upgrade.sh "$MAJOR" 2>&1 | tee postgres-acceptance.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: postgres-${{ matrix.major }}-acceptance
          path: postgres-acceptance.log
          retention-days: 7
  tensorboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Start actual viewer image
        run: |
          docker run -d --name tensorboard -p127.0.0.1:6006:6006 -v "$PWD/.github/resources/patch-acceptance/tensorboard.py:/acceptance.py:ro" tensorflow/tensorflow:2.21.0@sha256:f325279f01a3e742a1285d8d736b7e600f72ccf8b55cc19ee0a90b8cbfce4c7a python /acceptance.py
          for i in $(seq 1 120); do
            if docker exec tensorboard test -f /tmp/tensorboard-ready; then break; fi
            if [[ $(docker inspect -f '{{.State.Running}}' tensorboard) != true ]]; then docker logs tensorboard; exit 1; fi
            sleep 2
          done
          docker exec tensorboard cat /tmp/tensorboard-ready | tee schemes.json
      - name: Exercise browser navigation under proxy prefix
        run: |
          mkdir /tmp/browser
          cd /tmp/browser
          npm install playwright@1.56.1
          npx playwright install --with-deps chromium
          NODE_PATH=/tmp/browser/node_modules node "$GITHUB_WORKSPACE/.github/resources/patch-acceptance/tensorboard.cjs"
      - name: Require existing storage reader schemes
        run: |
          python3 - <<'PY'
          import json
          schemes=json.load(open('schemes.json'))
          assert 'gs' in schemes, schemes
          assert 's3' in schemes, schemes
          PY
      - name: Preserve runtime diagnostics
        if: always()
        run: docker logs tensorboard > tensorboard-runtime.log 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: tensorboard-runtime
          path: |
            tensorboard-runtime.log
            schemes.json
          retention-days: 7
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jeffspahr/jeffspahr-pipelines
          ref: bace9e83da95bb6dde6fb60f3aec4c29a3d544dc
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci
        working-directory: frontend
      - run: npx vitest run src/components/viewers/Tensorboard.test.tsx
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npx prettier --check src/components/viewers/Tensorboard.tsx src/components/viewers/Tensorboard.test.tsx
        working-directory: frontend
      - run: npm run build:viewer
        working-directory: frontend
      - run: git diff --binary > viewer-assets.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: tensorboard-viewer-assets
          path: viewer-assets.patch
          retention-days: 7
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: postgres18
            image: docker.io/postgres:18.6-alpine3.23@sha256:dec395d8c09c45609d6deb5c2388a07882d64fa59b1d98c1895792e085f57888
          - key: postgres14
            image: docker.io/postgres:14.24-alpine3.23@sha256:836ff0855bffedade962df0e09ddcb897cc398d2283f1f45d0776cc40f203f37
          - key: tensorboard
            image: tensorflow/tensorflow:2.21.0@sha256:f325279f01a3e742a1285d8d736b7e600f72ccf8b55cc19ee0a90b8cbfce4c7a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kubeflow/pipelines
          ref: 2143a241f968408bb49068c1a3d9e377572ebf3f
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: pip install -r .github/scripts/requirements.txt
      - uses: ./.github/actions/setup-osv-scanner
        with:
          arch: amd64
      - env:
          IMAGE: ${{ matrix.image }}
          PYTHONPATH: release
        run: python .github/resources/scripts/third_party_image_scan.py scan --image "$IMAGE" --output evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: patch-image-scan-${{ matrix.key }}
          path: evidence
          retention-days: 7
