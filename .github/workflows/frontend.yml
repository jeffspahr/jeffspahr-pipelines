name: 2.18 PostgreSQL and TensorBoard qualification
on:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  postgres:
    strategy:
      fail-fast: false
      matrix:
        major:
        - '14'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
      if: matrix.major == '18'
      with:
        go-version-file: go.mod
        cache: true
    - name: Persisted database and application schema upgrade
      env:
        MAJOR: ${{ matrix.major }}
      run: 'set -euo pipefail

        if [[ "$MAJOR" == 18 ]]; then go build -o /tmp/kfp-schema .github/resources/patch-acceptance/kfp-schema.go;
        fi

        KFP_SCHEMA=/tmp/kfp-schema bash .github/resources/patch-acceptance/upgrade.sh
        "$MAJOR" 2>&1 | tee postgres-acceptance.log


        grep -q "PASS PostgreSQL 14 same-volume upgrade" postgres-acceptance.log

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: postgres-${{ matrix.major }}-acceptance
        path: postgres-acceptance.log
        retention-days: 7
defaults:
  run:
    shell: bash
