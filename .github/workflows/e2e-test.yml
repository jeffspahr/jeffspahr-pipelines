name: KFP E2E Pipeline tests
env:
  E2E_TESTS_DIR: "./backend/test/end2end"
  NUMBER_OF_PARALLEL_NODES: 10
  CLUSTER_NAME: "kfp"
  NAMESPACE: "kubeflow"
  PYTHON_VERSION: "3.10"
  USER_NAMESPACE: "kubeflow-user-example-com"
  CA_CERT_PATH: ""
  AWS_ACCESS_KEY_ID: 'minio'
  AWS_SECRET_ACCESS_KEY: 'minio123'
  AWS_S3_BUCKET: 'mlpipeline'
  MLFLOW_TRACKING_URI: "https://localhost:8080/mlflow"
  MLFLOW_TRACKING_INSECURE_TLS: "true"

on: workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/image-builds.yml

  end-to-end-critical-scenario-multi-user-tests:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    strategy:
      matrix:
        k8s_version: ["v1.36.1"]
        cache_enabled: ["false"]
        multi_user: [ "true" ]
        # PostgreSQL deployments are unsupported in 2.18; see #14353.
        db_type: [ "mysql" ]
        test_label: ${{ fromJSON(github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/heads/gh-readonly-queue/') && '["E2ECritical"]' || '["E2ECriticalShardA", "E2ECriticalShardB"]') }}
      fail-fast: false
    name: End to End Critical Scenario Multi User ${{ matrix.test_label }} Tests - K8s ${{ matrix.k8s_version }} cacheEnabled=${{ matrix.cache_enabled }} multiUser=${{ matrix.multi_user }} artifactProxy=${{ matrix.cache_enabled }} dbType=${{ matrix.db_type }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create cluster
        uses: ./.github/actions/create-cluster
        id: create-cluster
        with:
          k8s_version: ${{ matrix.k8s_version }}
          cluster_name: ${{ env.CLUSTER_NAME }}

      - name: Deploy KFP
        uses: ./.github/actions/deploy
        if: ${{ steps.create-cluster.outcome == 'success' }}
        id: deploy
        with:
          image_artifacts_ready: ${{ needs.build.outputs.IMAGE_ARTIFACTS_READY }}
          cache_enabled: ${{ matrix.cache_enabled }}
          multi_user: "true"
          # The cache-enabled multi-user variant is the artifact-proxy
          # compatibility lane; both automatic Critical shards exercise it.
          artifact_proxy: ${{ matrix.cache_enabled }}
          db_type: ${{ matrix.db_type }}
          image_path: images_${{ github.run_id }}
          image_tag: latest
          image_registry: kind-registry:5000
          load_modelcar_fixture: 'true'

      - name: Prepare completed profile run
        id: profile-run
        run: |
          ./.github/resources/scripts/forward-port.sh kubeflow ml-pipeline-ui 3000 3000
          bash test/frontend-integration-test/prepare-profile-run.sh

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc

      - name: Install Chromium
        working-directory: frontend/scripts/ui-smoke-test
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium

      - name: Verify profile Run Details and Artifacts in Chromium
        working-directory: frontend/scripts/ui-smoke-test
        env:
          PROFILE_RUN_ID: ${{ steps.profile-run.outputs.run_id }}
          PROFILE_OWNER: ${{ steps.profile-run.outputs.owner }}
          PROFILE_OWNER_NAMESPACE: ${{ env.USER_NAMESPACE }}
        run: node --test profile-mlmd.test.js
