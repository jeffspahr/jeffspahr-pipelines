name: Historical log compatibility
on:
  push:
    branches: [codex/ordinary-log-check-2181]
permissions:
  contents: read
jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/create-cluster
        with:
          k8s_version: v1.36.1
          cluster_name: kfp
      - name: Install the release images with the CI profile fixture
        run: |
          set -euo pipefail
          sed 's|TEST_MANIFESTS="${TEST_MANIFESTS}/default"|TEST_MANIFESTS="manifests/kustomize/env/platform-agnostic-multi-user"|' .github/resources/scripts/deploy-kfp.sh > .github/resources/scripts/deploy-release.sh
          bash .github/resources/scripts/deploy-release.sh --multi-user
          kubectl -n kubeflow get deploy ml-pipeline -o json | jq -e '.spec.template.spec.containers|any(.image=="ghcr.io/kubeflow/kfp-api-server:2.18.1")'
      - name: Run a normal task and read its historical log
        run: |
          set -euo pipefail
          ns=kubeflow-user-example-com
          kubectl -n "$ns" create sa log-check
          kubectl -n "$ns" create rolebinding log-check --clusterrole=kubeflow-edit --serviceaccount="$ns:log-check"
          kubectl create namespace log-reader-control
          kubectl -n log-reader-control create sa control
          kubectl apply -f - <<'ROLE'
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata: {name: list-experiments, namespace: log-reader-control}
          rules:
            - apiGroups: [pipelines.kubeflow.org]
              resources: [experiments]
              verbs: [list]
          ROLE
          kubectl -n log-reader-control create rolebinding control --role=list-experiments --serviceaccount=log-reader-control:control
          kubectl -n kubeflow port-forward svc/ml-pipeline 18888:8888 >/tmp/port-forward.log 2>&1 &
          kubectl -n kubeflow port-forward svc/ml-pipeline 18889:8888 >/tmp/control-forward.log 2>&1 &
          for i in {1..30}; do curl -sSf localhost:18888/apis/v2beta1/healthz >/dev/null && break; sleep 2; done
          python3 -m pip install --quiet --target=/tmp/log-check-deps pyyaml
          PYTHONPATH=/tmp/log-check-deps python3 - <<'PY'
          import json, subprocess, time, urllib.request, yaml
          from pathlib import Path
          ns="kubeflow-user-example-com"
          def kube(*args):
              return subprocess.check_output(["kubectl","-n",ns,*args])
          token=kube("create","token","log-check","--audience=pipelines.kubeflow.org").decode().strip()
          def api(path,body=None,identity=token):
              port=18888 if identity==token else 18889
              request=urllib.request.Request(f"http://localhost:{port}"+path,
                  data=json.dumps(body).encode() if body else None,
                  headers={"Authorization":"Bearer "+identity,"Content-Type":"application/json"})
              with urllib.request.urlopen(request,timeout=15) as response:
                  return response.read(8*1024*1024+1)
          exp=json.loads(api("/apis/v2beta1/experiments",{"display_name":"log-check","namespace":ns}))["experiment_id"]
          spec=yaml.safe_load(Path("backend/test/v2/resources/hello-world.yaml").read_text())
          marker="historical-log-check-219"
          container=spec["deploymentSpec"]["executors"]["exec-echo"]["container"]
          container.update(command=["python3","-c"],args=['for i in range(32768):\n    print(f"INFO epoch={i//1024:02d} batch={i%1024:04d} samples=64 loss={1/(1+i/200):.7f} accuracy={0.5+i/70000:.5f} optimizer=adam split=train learning_rate=0.001")\nprint("historical-log-check-219")'])
          run=json.loads(api("/apis/v2beta1/runs",{"display_name":"ordinary-log","experiment_id":exp,"pipeline_spec":spec}))["run_id"]
          for i in range(120):
              state=json.loads(api("/apis/v2beta1/runs/"+run))["state"]
              if state=="SUCCEEDED": break
              if state in ("FAILED","CANCELED","ERROR"): raise RuntimeError("run ended "+state)
              time.sleep(5)
          else: raise TimeoutError("run completion")
          pods=json.loads(kube("get","pods","-l","pipeline/runid="+run,"-o","json"))["items"]
          for pod in pods:
              name=pod["metadata"]["name"]
              if marker.encode() in kube("logs",name,"-c","main").splitlines(): break
          else: raise RuntimeError("fixture task pod absent")
          route="/apis/v1alpha1/runs/"+run+"/nodes/"+name+"/log"
          assert marker.encode() in api(route)
          kube("delete","pod",name,"--wait=true","--timeout=120s")
          assert not kube("get","pod",name,"--ignore-not-found","-o","name").strip()
          assert marker.encode() in api(route)
          print("PASS: authorized ordinary task log was readable before and after pod removal")
          from concurrent.futures import ThreadPoolExecutor
          from statistics import median
          from threading import Barrier
          other=subprocess.check_output(["kubectl","-n","log-reader-control","create","token","control","--audience=pipelines.kubeflow.org"]).decode().strip()
          def control_read():
              start=time.monotonic()
              result=json.loads(api("/apis/v2beta1/experiments?namespace=log-reader-control",identity=other))
              assert isinstance(result,dict)
              return round((time.monotonic()-start)*1000,2)
          from threading import Event
          def read_log(started):
              request=urllib.request.Request("http://localhost:18888"+route,headers={"Authorization":"Bearer "+token})
              with urllib.request.urlopen(request,timeout=30) as response:
                  first=response.read(1024)
                  started.set()
                  data=first+response.read(8*1024*1024)
                  finished=time.monotonic()
              assert 3*1024*1024<=len(data)<8*1024*1024 and marker.encode() in data.splitlines()
              return finished,len(data)
          def paired_read(worker):
              started=Event()
              task=worker.submit(read_log,started)
              if not started.wait(15):
                  task.result(30)
                  raise RuntimeError("archive stream did not start")
              begin=time.monotonic()
              latency=control_read()
              end=time.monotonic()
              finished,size=task.result(30)
              return latency,round(1000*(min(end,finished)-begin),2),size
          control_read()
          baseline,paired,overlap=[],[],[]
          with ThreadPoolExecutor(max_workers=1) as worker:
              for i in range(12):
                  if i%2==0:
                      baseline.append(control_read())
                      time.sleep(1)
                  elapsed,concurrent_ms,size=paired_read(worker)
                  paired.append(elapsed)
                  overlap.append(concurrent_ms)
                  time.sleep(1)
                  if i%2:
                      baseline.append(control_read())
                      time.sleep(1)
          print("LARGE_LOG_RESULT",json.dumps(dict(bytes=size,baseline_ms=baseline,paired_ms=paired,
              overlap_ms=overlap,median_baseline=median(baseline),median_paired=median(paired))))
          PY
